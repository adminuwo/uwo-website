<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UWO™ | Admin Access</title>
    <link rel="icon" type="image/webp" href="images/uwo-logo.png">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- AOS Animate On Scroll -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #D6A559;
            --primary-dark: #B48E3D;
            --bg-deep: #050811;
            --bg-card: rgba(11, 17, 32, 0.85);
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --accent-blue: #162377;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            color: var(--text-main);
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(214, 165, 89, 0.1) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulse 10s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            z-index: 10;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            border: 1.5px solid rgba(214, 165, 89, 0.2);
            border-radius: 32px;
            padding: 50px 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), 
                        inset 0 0 20px rgba(214, 165, 89, 0.05);
            text-align: center;
        }

        .brand-logo {
            width: 85px;
            height: 85px;
            margin: 0 auto 25px;
            background: rgba(214, 165, 89, 0.1);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(214, 165, 89, 0.3);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
        }

        .brand-logo:hover {
            transform: translateY(-5px) rotate(5deg);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(214, 165, 89, 0.2);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 40px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-group {
            text-align: left;
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            padding-left: 5px;
        }

        .input-wrapper {
            position: relative;
            display: block;
        }

        .input-wrapper > i:not(.toggle-password) {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(214, 165, 89, 0.5);
            font-size: 16px;
            transition: color 0.3s;
            z-index: 10;
        }

        .toggle-password {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-dim);
            font-size: 16px;
            transition: color 0.3s;
            z-index: 10;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px 50px 18px 55px;
            color: #fff;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
            display: block;
        }

        /* Fix for Browser Autofill */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #fff;
            -webkit-box-shadow: 0 0 0px 1000px #0b1120 inset;
            transition: background-color 5000s ease-in-out 0s;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 15px rgba(214, 165, 89, 0.1);
        }

        input:focus + i {
            color: var(--primary);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #000;
            border: none;
            padding: 20px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 15px;
            box-shadow: 0 15px 30px rgba(214, 165, 89, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 40px rgba(214, 165, 89, 0.4);
        }

        .btn-login:active {
            transform: translateY(-1px) scale(1);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(214, 165, 89, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #message {
            margin-top: 20px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }

        .error { color: #ef4444; }
        .success { color: #10b981; }

        .role-selector-container {
            margin-bottom: 25px;
            text-align: left;
        }

        .role-selector-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--primary);
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            display: block;
        }

        .role-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 4px;
            position: relative;
        }

        .role-option {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dim);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            user-select: none;
            z-index: 2;
        }

        .role-option.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #000;
            box-shadow: 0 4px 15px rgba(214, 165, 89, 0.2);
        }

        .partner-link-container {
            margin-top: 15px;
            text-align: center;
            animation: fadeIn 0.3s ease forwards;
        }

        .partner-link-container a {
            color: var(--primary);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .partner-link-container a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Media Queries for Mobile Responsiveness */
        @media (max-width: 480px) {
            .login-card {
                padding: 40px 25px;
                border-radius: 24px;
            }
            .brand-logo {
                width: 70px;
                height: 70px;
                margin-bottom: 20px;
            }
            h1 {
                font-size: 24px;
            }
            .btn-login {
                padding: 16px;
                font-size: 13px;
            }
            .input-group label {
                font-size: 10px;
            }
            input {
                font-size: 15px;
                padding: 16px 45px 16px 50px;
            }
        }
    </style>

</head>
<body>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1072566655124889&ev=PageView&noscript=1"
    /></noscript>

    <div class="bg-glow"></div>

    <div class="login-container">
        <div class="login-card" data-aos="zoom-in" data-aos-duration="1000">
            <div class="brand-logo">
                <img src="images/uwo-logo.png" alt="UWO Logo">
            </div>
            <h1>Admin Login</h1>
            <p class="subtitle">Secure Access Only</p>

            <div class="input-group">
                <label id="emailLabel">Admin Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="admin@uwo.com" autocomplete="email">
                    <i class="fas fa-envelope"></i>
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
                    <i class="fas fa-lock"></i>
                    <i class="fas fa-eye toggle-password" id="togglePassword" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>

            <!-- Segmented Role Selector -->
            <div class="role-selector-container">
                <span class="role-selector-label">Login As</span>
                <div class="role-toggle">
                    <div class="role-option active" id="role-admin" onclick="selectRole('admin')">Admin</div>
                    <div class="role-option" id="role-partner" onclick="selectRole('partner')">Sales Partner</div>
                </div>
            </div>

            <button class="btn-login" id="loginBtn" onclick="handleLogin()">Sign In</button>

            <div id="message"></div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px;">
                <a href="index.html" class="back-link" style="margin-top: 0;" target="_blank" rel="noopener noreferrer"><i class="fas fa-arrow-left"></i> Return to Home</a>
                <a href="partner-login.html?register=true" id="reg-link-back" class="back-link" style="margin-top: 0; display: none;"><i class="fas fa-user-plus"></i> Request Access</a>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 20px; letter-spacing: 5px; font-weight: 800; font-size: 12px; text-transform: uppercase;">Signing In...</p>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        let currentRole = 'admin';

        if (localStorage.getItem("uwo_token")) {
            window.location.href = "admin.html";
        } else if (localStorage.getItem("uwo_partner_token")) {
            window.location.href = "partner-dashboard.html";
        }

        // Add Enter key support
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });

        function selectRole(role) {
            currentRole = role;
            document.getElementById("role-admin").classList.toggle("active", role === 'admin');
            document.getElementById("role-partner").classList.toggle("active", role === 'partner');
            document.getElementById("reg-link-back").style.display = role === 'partner' ? 'inline-block' : 'none';
            document.getElementById("emailLabel").innerText = role === 'admin' ? 'Admin Email' : 'Partner Email';
            document.getElementById("email").placeholder = role === 'admin' ? 'admin@uwo.com' : 'partner@uwo.com';
        }
        window.selectRole = selectRole;

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("password");
            const toggleIcon = document.getElementById("togglePassword");
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleIcon.classList.remove("fa-eye");
                toggleIcon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                toggleIcon.classList.remove("fa-eye-slash");
                toggleIcon.classList.add("fa-eye");
            }
        }

        async function handleLogin() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const loader = document.getElementById("loader");
            const messageEl = document.getElementById("message");
            const btn = document.getElementById("loginBtn");

            if (!email || !password) {
                showMessage("Email and password required", "error");
                return;
            }

            loader.style.display = "flex";
            btn.disabled = true;

            try {
                // Determine API URL
                const API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" 
                    ? "http://localhost:8080/api" 
                    : "https://uwo-backend-977864306871.asia-south1.run.app/api";

                const response = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password, role: currentRole }),
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.role === 'partner') {
                        localStorage.setItem("uwo_partner_token", data.token);
                        showMessage("Access Granted. Loading Partner Dashboard...", "success");
                        setTimeout(() => {
                            window.location.href = "partner-dashboard.html";
                        }, 1200);
                    } else {
                        localStorage.setItem("uwo_token", data.token);
                        showMessage("Access Granted. Loading Admin Dashboard...", "success");
                        setTimeout(() => {
                            window.location.href = "admin.html";
                        }, 1200);
                    }
                } else {
                    loader.style.display = "none";
                    btn.disabled = false;
                    showMessage("Login Failed: " + (data.message || "Invalid credentials"), "error");
                }
            } catch (error) {
                loader.style.display = "none";
                btn.disabled = false;
                showMessage("Server unreachable. Please check connection.", "error");
            }
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById("message");
            messageEl.innerText = text;
            messageEl.className = type;
            messageEl.style.display = "block";
            
            // Hide message after 5 seconds if error
            if (type === 'error') {
                setTimeout(() => {
                    messageEl.style.display = "none";
                }, 5000);
            }
        }
    </script>
</body>
</html>
